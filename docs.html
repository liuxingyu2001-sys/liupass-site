<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liupass 文档</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Liupass</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="docs.html">文档</a>
      </nav>
    </div>
  </header>

  <main class="docs-layout">
    <aside class="docs-sidebar">
      <h3>文档</h3>
      <a href="docs.html?doc=README">项目说明</a>
      <a href="docs.html?doc=USER_GUIDE">使用说明总览</a>
      <h3>模块指南</h3>
      <a href="docs.html?doc=guide/01-install">安装部署</a>
      <a href="docs.html?doc=guide/02-config">主配置</a>
      <a href="docs.html?doc=guide/03-pass">通行证</a>
      <a href="docs.html?doc=guide/04-task">任务</a>
      <a href="docs.html?doc=guide/05-reward">奖励</a>
      <a href="docs.html?doc=guide/06-command">命令权限</a>
      <a href="docs.html?doc=guide/07-api">开发 API</a>
      <a href="docs.html?doc=guide/08-faq">常见问题</a>
    </aside>
    <section class="docs-content">
      <article id="markdown-body"></article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Liupass 战令插件</p>
    </div>
  </footer>

  <script>
    async function loadDoc(doc) {
      doc = doc || 'README';
      const file = 'docs/' + doc + '.md';
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error('not found');
        const text = await res.text();
        document.getElementById('markdown-body').innerHTML = marked.parse(text);
      } catch (e) {
        document.getElementById('markdown-body').innerHTML = '<p>文档加载失败，请返回首页。</p>';
      }
    }

    document.getElementById('markdown-body').addEventListener('click', function (e) {
      const link = e.target.closest('a');
      if (!link) return;
      const href = link.getAttribute('href');
      if (href && href.endsWith('.md')) {
        e.preventDefault();
        const doc = href.replace(/\.md$/, '');
        loadDoc(doc);
        history.pushState(null, '', '?doc=' + encodeURIComponent(doc));
      }
    });

    const params = new URLSearchParams(window.location.search);
    loadDoc(params.get('doc') || 'README');
  </script>
</body>
</html>
