<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liupass 文档</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html" data-i18n="brand">Liupass</a>
      <nav>
        <a href="index.html" data-i18n="nav.home">首页</a>
        <a href="docs.html" data-i18n="nav.docs">文档</a>
        <button id="lang-switch" class="lang-switch">中文</button>
      </nav>
    </div>
  </header>

  <main class="docs-layout">
    <aside class="docs-sidebar">
      <h3 data-i18n="docs.h2">文档</h3>
      <a href="docs.html?doc=README" data-i18n="sidebar.readme">项目说明</a>
      <a href="docs.html?doc=USER_GUIDE" data-i18n="sidebar.user">使用说明总览</a>
      <a href="docs.html?doc=guide/01-install" data-i18n="sidebar.01">安装部署</a>
      <a href="docs.html?doc=guide/02-config" data-i18n="sidebar.02">主配置</a>
      <a href="docs.html?doc=guide/03-pass" data-i18n="sidebar.03">通行证</a>
      <a href="docs.html?doc=guide/04-task" data-i18n="sidebar.04">任务</a>
      <a href="docs.html?doc=guide/05-reward" data-i18n="sidebar.05">奖励</a>
      <a href="docs.html?doc=guide/06-command" data-i18n="sidebar.06">命令权限</a>
      <a href="docs.html?doc=guide/07-api" data-i18n="sidebar.07">开发 API</a>
      <a href="docs.html?doc=guide/08-faq" data-i18n="sidebar.08">常见问题</a>
    </aside>
    <section class="docs-content">
      <article id="markdown-body"></article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer">Liupass 战令插件</p>
    </div>
  </footer>

  <script>
    async function loadDoc(doc) {
      doc = doc || 'README';
      const file = I18N.doc(doc);
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error('not found');
        const text = await res.text();
        document.getElementById('markdown-body').innerHTML = marked.parse(text);
      } catch (e) {
        document.getElementById('markdown-body').innerHTML = '<p>Documentation failed to load. Please go back to the home page.</p>';
      }
    }

    document.getElementById('markdown-body').addEventListener('click', function (e) {
      const link = e.target.closest('a');
      if (!link) return;
      const href = link.getAttribute('href');
      if (href && href.endsWith('.md')) {
        e.preventDefault();
        const doc = href.replace(/\.md$/, '');
        loadDoc(doc);
        history.pushState(null, '', '?doc=' + encodeURIComponent(doc));
      }
    });

    const params = new URLSearchParams(window.location.search);
    loadDoc(params.get('doc') || 'README');
  </script>
</body>
</html>
